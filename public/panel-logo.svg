<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     role="img" aria-labelledby="bp-title">
  <title id="bp-title">bloc panel</title>
  <defs>
    <path id="bp-b" d="
      M114 336V105c0-27 21-49 48.5-49S211 78 211 105v60
      c8-4 18-6 29-6h55c52 0 87 34 87 86v91
      c0 55-36 92-91 92h-86c-55 0-91-37-91-92Z"/>
    <clipPath id="bp-face"><use href="#bp-b"/></clipPath>

    <linearGradient id="bp-bg" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#33333B"/>
      <stop offset=".54" stop-color="#414249"/>
      <stop offset="1" stop-color="#66686C"/>
    </linearGradient>
    <linearGradient id="bp-body" x1=".15" y1="0" x2=".9" y2="1">
      <stop stop-color="#737478"/>
      <stop offset=".5" stop-color="#4F5054"/>
      <stop offset="1" stop-color="#1D1E22"/>
    </linearGradient>
    <linearGradient id="bp-white" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#FAFAFA"/>
      <stop offset=".72" stop-color="#EFEFF0"/>
      <stop offset="1" stop-color="#D6D6D9"/>
    </linearGradient>
    <linearGradient id="bp-well" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111112"/>
      <stop offset="1" stop-color="#303034"/>
    </linearGradient>
    <radialGradient id="bp-amber" cx=".43" cy=".36" r=".72">
      <stop stop-color="#FFF5A6"/>
      <stop offset=".64" stop-color="#FFDC54"/>
      <stop offset="1" stop-color="#F4B018"/>
    </radialGradient>
    <radialGradient id="bp-glow">
      <stop stop-color="#FFC536" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FFC536" stop-opacity="0"/>
    </radialGradient>
    <filter id="bp-soft" x="-.35" y="-.65" width="1.7" height="2.3">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <path fill="url(#bp-bg)" d="M0 0h512v512H0z"/>
  <ellipse cx="254" cy="428" rx="133" ry="13"
           fill="#121217" opacity=".55" filter="url(#bp-soft)"/>
  <use href="#bp-b" transform="translate(16 -2)" fill="url(#bp-body)"
       stroke="#73747B" stroke-width=".7"/>
  <use href="#bp-b" fill="url(#bp-white)"
       stroke="#D2D2D5" stroke-width="1.3"/>
  <path d="M115 106c0-27 21-49 47.5-49S210 79 210 105"
        fill="none" stroke="#FFF" stroke-width="1.2" opacity=".78"/>

  <rect x="200" y="226" width="112" height="116" rx="36"
        fill="#414145" opacity=".54" filter="url(#bp-soft)"/>
  <rect x="202" y="229" width="107" height="111" rx="34"
        fill="url(#bp-well)" stroke="#EFEFF1" stroke-width="1.4"/>
  <ellipse cx="257" cy="290" rx="39" ry="45" fill="url(#bp-glow)"/>
  <rect x="237" y="263" width="43" height="45" rx="7"
        fill="#28282A" stroke="#101011" stroke-width="2"/>
  <rect x="241" y="268" width="34" height="35" rx="5"
        fill="url(#bp-amber)" stroke="#805308" stroke-width="1.4"/>
  <rect x="243" y="270" width="30" height="31" rx="4"
        fill="none" stroke="#FFF1A2" stroke-width=".85" opacity=".86"/>

  <circle cx="161" cy="101" r="15" fill="url(#bp-glow)"/>
  <circle cx="161" cy="101" r="8.6"
          fill="#8A590A" stroke="#F2D789" stroke-width="1.1"/>
  <circle cx="161" cy="101" r="6.1" fill="url(#bp-amber)"/>

  <g clip-path="url(#bp-face)">
    <path d="M113 365h270" stroke="#7B7B7E" stroke-width=".8"/>
    <g fill="#909194" stroke="#494A4D" stroke-width=".8">
      <circle cx="157" cy="380" r="4.3"/>
      <circle cx="338" cy="380" r="4.3"/>
    </g>
    <path d="m155 378 4 4m0-4-4 4m181-4 4 4m0-4-4 4"
          stroke="#404147" stroke-width=".9" stroke-linecap="round"/>
  </g>
</svg>
